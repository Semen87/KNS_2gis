<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#075985">
    <meta name="description" content="Мобильный справочник канализационных насосных станций">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="icons/icon.svg">
    <link rel="stylesheet" href="style.css">
    <title>Справочник КНС</title>
  </head>
  <body>
    <main class="app-shell">
      <header class="hero">
        <div class="hero-top">
          <div>
            <h1>Справочник по КНС</h1>
          </div>
          <button id="installButton" class="icon-button" type="button" hidden aria-label="Установить приложение" title="Установить приложение">⇩</button>
        </div>
        <p id="stationCount" class="station-count">Загрузка данных…</p>
      </header>

      <section class="controls" aria-label="Поиск и фильтры">
        <label class="search-box">
          <span aria-hidden="true">⌕</span>
          <input id="searchInput" type="search" autocomplete="off" placeholder="Номер КНС или адрес" aria-label="Поиск по номеру КНС или адресу">
          <button id="clearSearch" type="button" hidden aria-label="Очистить поиск">×</button>
        </label>
        <label class="district-filter">
          <span>Район</span>
          <select id="districtSelect" aria-label="Фильтр по району"><option value="">Все районы</option></select>
        </label>
      </section>

      <p id="statusMessage" class="status-message" role="status"></p>
      <section id="stationList" class="station-list" aria-live="polite"></section>
    </main>

    <template id="stationTemplate">
      <article class="station-card">
        <div class="card-heading">
          <div>
            <p class="district"></p>
            <h2></h2>
          </div>
          <span class="station-icon" aria-hidden="true">КНС</span>
        </div>
        <dl class="primary-fields"></dl>
        <details class="details" hidden>
          <summary>Все сведения <span aria-hidden="true">⌄</span></summary>
          <dl class="extra-fields"></dl>
        </details>
        <a class="two-gis-button" target="_blank" rel="noopener noreferrer" hidden>Открыть в 2ГИС <span aria-hidden="true">↗</span></a>
      </article>
    </template>

    <script type="module" src="app.js"></script>
  </body>
</html>
